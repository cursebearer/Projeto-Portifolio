<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DocChain — Login</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 600px at 20% 10%, rgba(126,182,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 80% 90%, rgba(111,220,140,0.06), transparent 60%),
      var(--bg);
  }
  .login-card {
    width: 420px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .logo-name { font-size: 22px; font-weight: 700; color: var(--primary); letter-spacing: -0.01em; }
  .shield { color: var(--primary); }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
  .field-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .forgot { font-size: 12px; color: var(--text-dim); text-decoration: none; }
  .forgot:hover { color: var(--text-muted); }
  .btn-primary { width: 100%; padding: 12px; margin-top: 8px; font-size: 14px; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--text-dim); font-size: 12px; margin: 24px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .register-link { text-align: center; font-size: 14px; color: var(--text-muted); }
  .register-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
  .register-link a:hover { color: var(--primary-strong); }
</style>
</head>
<body>
  <div class="card login-card">
    <div class="logo">
      <svg class="shield" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      <span class="logo-name">DocChain</span>
    </div>
    <h1>Entrar</h1>
    <div class="sub">Registro documental com prova on-chain</div>

    <div class="field">
      <label>E-mail</label>
      <input class="input" type="email" placeholder="voce@exemplo.com">
    </div>

    <div class="field">
      <div class="field-row">
        <label>Senha</label>
        <a href="#" class="forgot">Esqueci a senha</a>
      </div>
      <input class="input" type="password" placeholder="••••••••">
    </div>

    <button class="btn-primary">Entrar</button>

    <div class="divider">ou</div>

    <div class="register-link">
      Não tenho conta — <a href="#">Criar conta</a>
    </div>
  </div>
</body>
</html>
