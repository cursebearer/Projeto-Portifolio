sonar.projectKey=cursebearer_Projeto-Portifolio
sonar.organization=cursebearer
sonar.projectName=DocChain

sonar.sources=docchain-api/src,docchain-web/app,docchain-web/components,docchain-web/lib,docchain-web/store,docchain-contracts/contracts
sonar.tests=docchain-api/src,docchain-api/test,docchain-web/app,docchain-web/components,docchain-web/lib,docchain-web/store,docchain-contracts/test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,docchain-web/components/ui/**,docchain-api/src/blockchain/abi/**

sonar.javascript.lcov.reportPaths=docchain-api/coverage/lcov.info,docchain-web/coverage/lcov.info

# Mesmas exclusões de cobertura usadas no jest.config.ts da API
sonar.coverage.exclusions=**/*.module.ts,docchain-api/src/main.ts,**/dto/**,**/decorators/**,**/guards/**,**/strategies/**,docchain-api/src/storage/storage.interface.ts,docchain-contracts/**

sonar.sourceEncoding=UTF-8
