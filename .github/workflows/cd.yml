name: CD

# Publica as imagens da API e do web no GitHub Container Registry depois que o CI
# passa na main. O job de deploy no provedor entra aqui quando a hospedagem estiver definida.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Imagem ${{ matrix.service }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: docchain-api
          - service: web
            context: docchain-web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${owner}/docchain-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy produção
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
    steps:
      - name: Hospedagem não configurada
        if: env.DEPLOY_HOST == ''
        run: echo "::warning::DEPLOY_HOST não configurado; imagens publicadas, deploy pulado."

      - uses: actions/checkout@v7
        if: env.DEPLOY_HOST != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Chave SSH
        if: env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Envia arquivos de deploy
        if: env.DEPLOY_HOST != ''
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/docchain'
          scp -i ~/.ssh/deploy_key -r deploy/docker-compose.prod.yml deploy/Caddyfile monitoring \
            "$DEPLOY_USER@$DEPLOY_HOST:~/docchain/"

      - name: Atualiza containers
        if: env.DEPLOY_HOST != ''
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            cd ~/docchain &&
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${sha::7}/' .env &&
            docker compose -f docker-compose.prod.yml pull &&
            docker compose -f docker-compose.prod.yml up -d --remove-orphans &&
            docker image prune -f
          "

      - name: Health check
        if: env.DEPLOY_HOST != '' && env.DEPLOY_DOMAIN != ''
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://$DEPLOY_DOMAIN/api/health" && exit 0
            sleep 10
          done
          echo "::error::API não respondeu em https://$DEPLOY_DOMAIN/api/health"
          exit 1
